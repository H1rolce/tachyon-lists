name: lists

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - '.github/workflows/lists.yml'

permissions:
  contents: write

concurrency:
  group: lists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать lists.json
        run: python3 build.py

      - name: Что изменилось
        id: diff
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "изменений нет — ни коммита, ни релиза"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      - name: Сохранить в репозиторий
        if: steps.diff.outputs.changed == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists.json
          git commit -m "Списки: $(python3 -c 'import json;print(json.load(open("lists.json"))["version"])')"
          git push

      - name: Обновить релиз
        if: steps.diff.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="$(python3 -c 'import json;print(json.load(open("lists.json"))["version"])')"
          if gh release view lists >/dev/null 2>&1; then
            gh release upload lists lists.json --clobber
            gh release edit lists --title "Каталог списков $ver"
          else
            gh release create lists lists.json \
              --title "Каталог списков $ver" \
              --notes "Единственный файл этого релиза — lists.json: перечень списков Tachyon Lists для steer в zapret manager или splify2. Ссылка для роутера: https://github.com/${{ github.repository }}/releases/latest/download/lists.json"
          fi