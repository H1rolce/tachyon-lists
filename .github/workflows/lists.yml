name: lists

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - '.github/workflows/lists.yml'

permissions:
  contents: write

concurrency:
  group: lists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build lists.json
        run: python3 build.py

      - name: Check changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists.json
          git commit -m "chore: update lists.json ($(python3 -c 'import json;print(json.load(open("lists.json"))["version"])'))"
          git push

      - name: Update release asset
        if: steps.diff.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 lists.json --clobber
          fi